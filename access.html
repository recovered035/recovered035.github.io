
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESTRICTED ACCESS</title>

<style>
body {
    background: #050807;
    color: #7bba91;
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: 100px auto;
}

h1 {
    color: #a4e5b6;
    letter-spacing: 5px;
    text-shadow: 0 0 10px #368b54;
}

.line {
    border-top: 1px solid #315b40;
    margin: 25px 0;
}

input {
    background: #0a110d;
    color: #a4e5b6;
    border: 1px solid #315b40;
    padding: 12px;
    font-family: inherit;
    font-size: 16px;
    width: 65%;
    max-width: 300px;
    box-sizing: border-box;
}

button {
    background: #173522;
    color: #a4e5b6;
    border: 1px solid #497957;
    padding: 12px 18px;
    font-family: inherit;
    cursor: pointer;
}

button:hover {
    background: #285338;
}

#message {
    margin-top: 25px;
    min-height: 40px;
    line-height: 1.7;
}

.warning {
    color: #d66b6b;
}

.success {
    color: #a4e5b6;
}

.small {
    color: #526b59;
    font-size: 11px;
}

a {
    color: #a4e5b6;
}

@media (max-width: 480px) {
    .container {
        margin-top: 60px;
    }

    input {
        width: 100%;
        max-width: none;
        margin-bottom: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

<p class="small">RECOVERED035 / SECURITY TERMINAL</p>

<h1>RESTRICTED ACCESS</h1>

<div class="line"></div>

<p>FILE 002: RECORDING_002</p>

<p>THIS FILE REQUIRES AUTHENTICATION.</p>

<p>ENTER RECOVERY KEY:</p>

<form id="loginForm">
    <input
        type="text"
        id="password"
        placeholder="ENTER KEY..."
        autocomplete="off"
        required
    >

    <button type="submit">AUTHENTICATE</button>
</form>

<div id="message"></div>

<div class="line"></div>

<p class="small">ARCHIVE ID: 035</p>
<p class="small">UNAUTHORISED ACCESS WILL BE LOGGED.</p>

<p><a href="index.html">[ RETURN ]</a></p>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const password = document.getElementById("password")
        .value.trim().toUpperCase();

    const message = document.getElementById("message");

    if (password === "STATIC") {
        message.className = "success";
        message.innerHTML =
            "PASSWORD ACCEPTED.<br>" +
            "ACCESS GRANTED.<br>" +
            "RETRIEVING FILE 002...";

        setTimeout(function() {
            window.location.href = "recording.html";
        }, 1500);

    } else {
        message.className = "warning";
        message.textContent = "ACCESS DENIED. INVALID RECOVERY KEY.";
    }
});
</script>

</body>
</html>
